[package]
name = "app"
version = "0.2.0"
description = "CGLI Canvas Agent Orchestrator (100% Rust)"
authors = ["CGLI Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
cgli-core = { path = "../crates/cgli-core" }
cgli-vault = { path = "../crates/cgli-vault" }
cgli-desktop = { path = "../crates/cgli-desktop" }
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
portable-pty = "0.8"
tokio = { version = "1", features = ["full"] }
