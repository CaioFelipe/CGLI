[package]
name = "cgli-pty-vt"
version.workspace = true
edition.workspace = true

[dependencies]
cgli-core.workspace = true
serde.workspace = true
serde_json.workspace = true
leptos = { version = "0.6", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "Window",
    "KeyboardEvent",
    "EventSource",
    "MessageEvent",
] }
