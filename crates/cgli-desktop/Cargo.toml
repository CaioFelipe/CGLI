[package]
name = "cgli-desktop"
version.workspace = true
edition.workspace = true

[lib]
name = "cgli_desktop"
path = "src/lib.rs"

[[bin]]
name = "cgli-desktop"
path = "src/main.rs"

[dependencies]
cgli-core.workspace = true
cgli-vault.workspace = true
cgli-pty-vt.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
log.workspace = true
base64.workspace = true
portable-pty = "0.8"
axum = "0.7"
tower-http = { version = "0.5", features = ["cors"] }
futures-util = "0.3.34"
async-stream = "0.3.6"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
