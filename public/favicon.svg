<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" fill="none">
  <defs>
    <linearGradient id="cgli-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="cgli-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="32" height="32" rx="7.5" fill="url(#cgli-bg)" />
  <rect width="30" height="30" x="1" y="1" rx="6.5" stroke="rgba(255,255,255,0.2)" stroke-width="1" />

  <!-- Graph Connection Lines -->
  <path d="M9 16 L16 10 L23 16 L16 22 Z" stroke="rgba(255,255,255,0.4)" stroke-width="1.5" stroke-linejoin="round" />
  <path d="M16 10 L16 22" stroke="rgba(255,255,255,0.5)" stroke-width="1.5" />

  <!-- Center Hub Node -->
  <circle cx="16" cy="16" r="3.2" fill="#FFFFFF" filter="url(#cgli-glow)" />

  <!-- Left Node (Claude Orange) -->
  <circle cx="9" cy="16" r="2.4" fill="#FB923C" stroke="#FFFFFF" stroke-width="1" />

  <!-- Top Node (Canvas Purple) -->
  <circle cx="16" cy="10" r="2.4" fill="#C084FC" stroke="#FFFFFF" stroke-width="1" />

  <!-- Right Node (AGY Sky Blue) -->
  <circle cx="23" cy="16" r="2.4" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1" />

  <!-- Bottom Node (Visual Rose) -->
  <circle cx="16" cy="22" r="2.4" fill="#FB7185" stroke="#FFFFFF" stroke-width="1" />
</svg>